# Двух-узловой кластер: два инстанса demo-app синхронизируются через общий Redis.
# Открой http://localhost:8080 и http://localhost:8090 в разных вкладках —
# правки на одном инстансе долетят до другого через Redis Pub/Sub.

services:
  redis:
    image: redis:7-alpine
    container_name: crdt-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  node-a:
    build: .
    container_name: crdt-node-a
    environment:
      HTTP_ADDR: ":8080"
      REDIS_ADDR: "redis:6379"
      NODE_ID: "node-a"
      DOC_ID: "demo"
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy

  node-b:
    build: .
    container_name: crdt-node-b
    environment:
      HTTP_ADDR: ":8080"
      REDIS_ADDR: "redis:6379"
      NODE_ID: "node-b"
      DOC_ID: "demo"
    ports:
      - "8090:8080"
    depends_on:
      redis:
        condition: service_healthy

  analytics-db:
    image: postgres:16-alpine
    container_name: crdt-analytics-db
    environment:
      POSTGRES_USER: crdt
      POSTGRES_PASSWORD: crdt_password
      POSTGRES_DB: crdt_analytics
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crdt -d crdt_analytics"]
      interval: 5s
      timeout: 3s
      retries: 10

  analytics-service:
    build:
      context: .
      dockerfile: cmd/analytics-service/Dockerfile
    container_name: crdt-analytics-service
    environment:
      REDIS_ADDR: "redis:6379"
      DB_DSN: "postgres://crdt:crdt_password@analytics-db:5432/crdt_analytics?sslmode=disable"
      HTTP_ADDR: ":8082"
    ports:
      - "8082:8082"
    depends_on:
      redis:
        condition: service_healthy
      analytics-db:
        condition: service_healthy

  history-service:
    build:
      context: .
      dockerfile: cmd/history-service/Dockerfile
    container_name: crdt-history-service
    environment:
      REDIS_ADDR: "redis:6379"
      DB_DSN: "postgres://crdt:crdt_password@analytics-db:5432/crdt_analytics?sslmode=disable"
      HTTP_ADDR: ":8083"
    ports:
      - "8083:8083"
    depends_on:
      redis:
        condition: service_healthy
      analytics-db:
        condition: service_healthy


